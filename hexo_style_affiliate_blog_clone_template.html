<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝦賺筆記｜推廣九折</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Noto Sans TC", sans-serif;
    }

    body {
      background: #f3f3f3;
      color: #333;
    }

    .navbar {
      width: 100%;
      height: 75px;
      background: #b8cee3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 45px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-area img {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.7);
    }

    .logo-area h1 {
      font-size: 22px;
      font-weight: 800;
      color: #3a3a3a;
    }

    .nav-center {
      font-size: 20px;
      font-weight: 700;
      color: white;
    }

    .nav-links {
      display: flex;
      gap: 40px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .wrapper {
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      border: 1px solid #ececec;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 25px;
      font-size: 20px;
    }

    textarea {
      width: 100%;
      height: 220px;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 20px;
      resize: none;
      font-size: 18px;
      outline: none;
      margin-bottom: 18px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      color: #999;
      margin-bottom: 18px;
      font-size: 16px;
    }

    .button-row {
      display: flex;
      gap: 12px;
    }

    .generate-btn {
      flex: 1;
      height: 62px;
      border: none;
      border-radius: 14px;
      background: #0c4cb3;
      color: white;
      font-size: 30px;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-btn {
      width: 110px;
      border: none;
      border-radius: 14px;
      background: #efefef;
      font-size: 18px;
      cursor: pointer;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      background: #f7f8fb;
      display: none;
    }

    .result a {
      display: block;
      margin-bottom: 12px;
      color: #0c4cb3;
      word-break: break-all;
    }

    .result a:last-child {
      margin-bottom: 0;
    }

    @media(max-width: 768px) {
      .navbar {
        padding: 0 18px;
      }

      .nav-center {
        display: none;
      }

      .nav-links {
        gap: 16px;
      }

      .logo-area h1 {
        font-size: 18px;
      }

      .card {
        padding: 22px;
      }

      .title {
        font-size: 30px;
      }

      .generate-btn {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo-area">
      <img src="/mnt/data/6e93b124-9dca-4111-839f-6bf87056242f.png" alt="蝦賺筆記LOGO">
      <h1>蝦賺筆記</h1>
    </div>

    <div class="nav-center">
      推廣九折
    </div>

    <div class="nav-links">
      <a href="#">Instagram</a>
      <a href="#">LINE社群</a>
    </div>
  </nav>

  <div class="wrapper">
    <div class="card">

      <div class="title">✨ 蝦皮推廣券自動轉換器</div>

      <div class="subtitle">
        點連結後自動出現9折券，一人五張
      </div>

      <textarea id="links" placeholder="每行一個連結"></textarea>

      <div class="info-row">
        <span id="count">偵測到 0 個網址</span>
        <span>一次最多 5 個</span>
      </div>

      <div class="button-row">
        <button class="generate-btn" onclick="generateLinks()">產生連結</button>
        <button class="clear-btn" onclick="clearLinks()">清除</button>
      </div>

      <div class="result" id="result"></div>

    </div>
  </div>

  <script>

    const textarea = document.getElementById('links');
    const count = document.getElementById('count');
    const result = document.getElementById('result');

    function getLines() {
      return textarea.value
        .split('\n')
        .map(line => line.trim())
        .filter(line => line !== '');
    }

    textarea.addEventListener('input', () => {
      const lines = getLines();
      count.innerText = `偵測到 ${lines.length} 個網址`;
    });

    function generateLinks() {
      const lines = getLines().slice(0, 5);

      if (lines.length === 0) {
        alert('請輸入網址');
        return;
      }

      result.innerHTML = '';
      result.style.display = 'block';

      lines.forEach(link => {

        const finalLink = link.includes('?')
          ? `${link}&coupon=90OFF`
          : `${link}?coupon=90OFF`;

        const a = document.createElement('a');

        a.href = finalLink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerText = finalLink;

        result.appendChild(a);
      });
    }

    function clearLinks() {
      textarea.value = '';
      count.innerText = '偵測到 0 個網址';
      result.style.display = 'none';
      result.innerHTML = '';
    }

    // 測試案例
    console.assert(getLines().length === 0, '空白輸入應該為 0');

  </script>

</body>
</html>
